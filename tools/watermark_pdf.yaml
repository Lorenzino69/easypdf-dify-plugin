identity:
  name: watermark_pdf
  author: easypdf
  label:
    en_US: Add Watermark
description:
  human:
    en_US: Stamp a text watermark such as CONFIDENTIAL or DRAFT on every page.
  llm: Add a diagonal text watermark (for example CONFIDENTIAL or DRAFT) to every page of a PDF.
parameters:
- name: file
  type: file
  required: true
  label:
    en_US: PDF file
  human_description:
    en_US: The PDF file to process (50 MB max).
  llm_description: The PDF file to process.
  form: llm
- name: text
  type: string
  required: true
  label:
    en_US: Text
  human_description:
    en_US: Watermark text, for example CONFIDENTIAL.
  llm_description: The watermark text.
  form: llm
- name: opacity
  type: number
  required: false
  label:
    en_US: Opacity
  human_description:
    en_US: From 0 (invisible) to 1 (opaque). Default 0.3.
  llm_description: Opacity between 0 and 1. Default 0.3.
  form: llm
  default: 0.3
  min: 0
  max: 1
- name: color
  type: string
  required: false
  label:
    en_US: Color
  human_description:
    en_US: 'Hex color of the text. Default #888888.'
  llm_description: 'Hex color like #888888. Default #888888.'
  form: llm
  default: '#888888'
- name: rotation
  type: number
  required: false
  label:
    en_US: Rotation
  human_description:
    en_US: Angle of the text in degrees. Default -45.
  llm_description: Angle of the watermark text in degrees. Default -45.
  form: llm
  default: -45
  min: -360
  max: 360
- name: font_size
  type: number
  required: false
  label:
    en_US: Font size
  human_description:
    en_US: Font size in points. Default 60.
  llm_description: Font size in points. Default 60.
  form: llm
  default: 60
  min: 6
  max: 300
extra:
  python:
    source: tools/watermark_pdf.py
