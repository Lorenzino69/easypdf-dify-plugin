identity:
  name: extract_pages
  author: easypdf
  label:
    en_US: Extract Pages
description:
  human:
    en_US: Keep only some pages of a PDF, in the order you list them.
  llm: Create a new PDF with only the listed pages of the input PDF, in the given order.
parameters:
- name: file
  type: file
  required: true
  label:
    en_US: PDF file
  human_description:
    en_US: The PDF file to process (50 MB max).
  llm_description: The PDF file to process.
  form: llm
- name: pages
  type: string
  required: true
  label:
    en_US: Pages
  human_description:
    en_US: Pages to keep, for example 1,3,5-7. The first page is 1.
  llm_description: Comma-separated page numbers and ranges to keep, 1-based, for example 1,3,5-7.
  form: llm
extra:
  python:
    source: tools/extract_pages.py
